<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sophia & Alexander — Wedding Celebration</title>
    <meta name="description" content="Join us in celebrating the wedding of Sophia Martinez & Alexander Hayes. RSVP, event schedule, our story, hotel block, and registry information." />

    <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FAF7F2] text-[#4A3F35] font-sans antialiased selection:bg-[#E8DFD1] selection:text-[#2A231C]">
    <div id="root"></div>

    <!-- Hidden form for Netlify bots to discover fields at build time -->
    <form name="wedding-rsvp" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="form-name" value="wedding-rsvp" />
      <input type="text" name="guest_name" />
      <input type="text" name="party_members" />
      <input type="text" name="attendance" />
      <input type="text" name="dietary_restrictions" />
      <input type="text" name="notes" />
      <input type="text" name="submitted_at" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
